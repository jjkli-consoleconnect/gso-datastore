<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WNDA Knowledge Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface2: #22263a;
        --border: #2e3248;
        --accent: #6366f1;
        --accent-hover: #4f52d1;
        --text: #e2e4f0;
        --text-muted: #7c82a0;
        --user-bg: #6366f1;
        --bot-bg: #1e2235;
        --source-bg: #161929;
        --error: #f87171;
        --radius: 12px;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .logo {
        width: 34px;
        height: 34px;
        background: var(--accent);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      header h1 {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
      }

      header p {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 1px;
      }

      #chat-window {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scroll-behavior: smooth;
      }

      #chat-window::-webkit-scrollbar { width: 6px; }
      #chat-window::-webkit-scrollbar-track { background: transparent; }
      #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

      .message {
        display: flex;
        gap: 10px;
        max-width: 800px;
        animation: fadeIn 0.2s ease;
      }

      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

      .message.user { align-self: flex-end; flex-direction: row-reverse; }
      .message.bot { align-self: flex-start; }

      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        flex-shrink: 0;
        margin-top: 2px;
      }

      .message.user .avatar { background: var(--user-bg); }
      .message.bot .avatar { background: var(--surface2); }

      .bubble {
        padding: 12px 16px;
        border-radius: var(--radius);
        font-size: 14px;
        line-height: 1.6;
        max-width: calc(100% - 44px);
      }

      .message.user .bubble {
        background: var(--user-bg);
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .message.bot .bubble {
        background: var(--bot-bg);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .message.bot .bubble p { margin: 0 0 8px; }
      .message.bot .bubble p:last-of-type { margin-bottom: 0; }
      .message.bot .bubble ul { margin: 4px 0 8px 18px; padding: 0; }
      .message.bot .bubble li { margin-bottom: 4px; }

      .bubble.error { border-color: var(--error); color: var(--error); }

      .sources {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .sources-label {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
      }

      .source-link {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--source-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        text-decoration: none;
        color: var(--accent);
        font-size: 12px;
        transition: border-color 0.15s;
      }

      .source-link:hover { border-color: var(--accent); }

      .typing-indicator {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 14px 16px;
        background: var(--bot-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        border-bottom-left-radius: 4px;
        width: fit-content;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-muted);
        animation: bounce 1.2s infinite;
      }

      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-5px); }
      }

      #input-bar {
        padding: 16px 20px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }

      #input-form {
        display: flex;
        gap: 10px;
        max-width: 800px;
        margin: 0 auto;
      }

      #question-input {
        flex: 1;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-size: 14px;
        padding: 12px 16px;
        resize: none;
        outline: none;
        transition: border-color 0.15s;
        line-height: 1.5;
        min-height: 46px;
        max-height: 120px;
        overflow-y: auto;
      }

      #question-input::placeholder { color: var(--text-muted); }
      #question-input:focus { border-color: var(--accent); }

      #send-btn {
        background: var(--accent);
        border: none;
        border-radius: var(--radius);
        color: #fff;
        cursor: pointer;
        font-size: 18px;
        padding: 0 18px;
        transition: background 0.15s, opacity 0.15s;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #send-btn:hover { background: var(--accent-hover); }
      #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

      .welcome {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        flex: 1;
        padding: 40px;
        color: var(--text-muted);
      }

      .welcome-icon { font-size: 48px; opacity: 0.6; }
      .welcome h2 { font-size: 18px; color: var(--text); font-weight: 600; }
      .welcome p { font-size: 13px; max-width: 380px; line-height: 1.6; }

      .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 8px;
      }

      .suggestion-chip {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 20px;
        color: var(--text);
        cursor: pointer;
        font-family: "Inter", sans-serif;
        font-size: 12px;
        padding: 6px 14px;
        transition: border-color 0.15s, color 0.15s;
      }

      .suggestion-chip:hover { border-color: var(--accent); color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">🔮</div>
      <div>
        <h1>WNDA Knowledge Assistant</h1>
        <p>Answers from Confluence · WNDA Space</p>
      </div>
    </header>

    <div id="chat-window">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">📚</div>
        <h2>Ask anything about WNDA</h2>
        <p>I'll search the WNDA Confluence space and answer using the latest documentation.</p>
        <div class="suggestions">
          <button class="suggestion-chip" onclick="sendSuggestion(this)">What is the Wanda architecture?</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">How does the provisioning flow work?</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">What APIs does Wanda expose?</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">Explain the onboarding process</button>
        </div>
      </div>
    </div>

    <div id="input-bar">
      <form id="input-form" onsubmit="handleSubmit(event)">
        <textarea
          id="question-input"
          placeholder="Ask a question about WNDA..."
          rows="1"
          maxlength="1000"
          required
          autofocus
        ></textarea>
        <button type="submit" id="send-btn" title="Send">&#10148;</button>
      </form>
    </div>

    <script>
      const chatWindow = document.getElementById("chat-window");
      const input = document.getElementById("question-input");
      const sendBtn = document.getElementById("send-btn");
      let isLoading = false;

      // Auto-resize textarea
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
      });

      // Send on Enter (Shift+Enter for newline)
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          if (!isLoading && input.value.trim()) {
            document.getElementById("input-form").dispatchEvent(new Event("submit"));
          }
        }
      });

      function sendSuggestion(btn) {
        input.value = btn.textContent;
        document.getElementById("input-form").dispatchEvent(new Event("submit"));
      }

      function removeWelcome() {
        const w = document.getElementById("welcome");
        if (w) w.remove();
      }

      function renderMarkdown(text) {
        // Escape HTML first
        let s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        // Bold **text**
        s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        // Convert lines starting with * or - into list items
        s = s.replace(/^[\*\-] (.+)/gm, '<li>$1</li>');
        // Wrap consecutive <li> blocks in <ul>
        s = s.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
        // Paragraphs: double newline → paragraph break
        s = s.replace(/\n{2,}/g, '</p><p>');
        // Single newlines not inside lists → <br>
        s = s.replace(/(?<!<\/li>)\n(?!<li>|<ul>|<\/ul>|<p>|<\/p>)/g, '<br>');
        return '<p>' + s + '</p>';
      }

      function appendMessage(role, text, sources) {
        removeWelcome();
        const msg = document.createElement("div");
        msg.className = `message ${role}`;

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "user" ? "👤" : "🔮";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (role === "bot") {
          bubble.innerHTML = renderMarkdown(text);
        } else {
          bubble.textContent = text;
        }

        if (sources && sources.length > 0) {
          const sourcesEl = document.createElement("div");
          sourcesEl.className = "sources";
          const label = document.createElement("div");
          label.className = "sources-label";
          label.textContent = "Sources";
          sourcesEl.appendChild(label);
          sources.forEach((s) => {
            const a = document.createElement("a");
            a.className = "source-link";
            a.href = s.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.innerHTML = `<span>📄</span><span>${s.title}</span>`;
            sourcesEl.appendChild(a);
          });
          bubble.appendChild(sourcesEl);
        }

        msg.appendChild(avatar);
        msg.appendChild(bubble);
        chatWindow.appendChild(msg);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return msg;
      }

      function appendError(text) {
        removeWelcome();
        const msg = document.createElement("div");
        msg.className = "message bot";
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "🔮";
        const bubble = document.createElement("div");
        bubble.className = "bubble error";
        bubble.textContent = text;
        msg.appendChild(avatar);
        msg.appendChild(bubble);
        chatWindow.appendChild(msg);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }

      function showTyping() {
        removeWelcome();
        const msg = document.createElement("div");
        msg.className = "message bot";
        msg.id = "typing";
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "🔮";
        const indicator = document.createElement("div");
        indicator.className = "typing-indicator";
        indicator.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        msg.appendChild(avatar);
        msg.appendChild(indicator);
        chatWindow.appendChild(msg);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }

      function removeTyping() {
        const t = document.getElementById("typing");
        if (t) t.remove();
      }

      async function handleSubmit(e) {
        e.preventDefault();
        const question = input.value.trim();
        if (!question || isLoading) return;

        isLoading = true;
        sendBtn.disabled = true;
        input.value = "";
        input.style.height = "auto";

        appendMessage("user", question);
        showTyping();

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });
          const data = await res.json();
          removeTyping();

          if (!res.ok) {
            appendError("Sorry, something went wrong. Please try again.");
            console.error(data);
          } else {
            appendMessage("bot", data.answer, data.sources);
          }
        } catch (err) {
          removeTyping();
          appendError("Network error. Please check your connection and try again.");
          console.error(err);
        } finally {
          isLoading = false;
          sendBtn.disabled = false;
          input.focus();
        }
      }
    </script>
  </body>
</html>
